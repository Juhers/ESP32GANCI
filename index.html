<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eceef2">
<title>Gantungan Musik – Kirim Gambar</title>
<!-- favicon inline supaya tidak ada request /favicon.ico (404) di GitHub Pages -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎵%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#eceef2; --surface:#ffffff; --ink:#15171c; --mut:#5d6370; --line:#d9dce3;
    --ac:#2b59ff; --acink:#ffffff; --soft:#e4e7ee; --ok:#12805c; --bad:#c62f3b;
    --bezel:#17181d;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f1115; --surface:#181b21; --ink:#eceef3; --mut:#9aa1ae; --line:#2a2e37;
      --ac:#7d9bff; --acink:#0b1020; --soft:#22262e; --ok:#4cd6a0; --bad:#ff7b86;
      --bezel:#07080a;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:max(20px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
  }
  .wrap{max-width:440px;margin:0 auto}
  header{margin:4px 0 28px}
  h1{font-size:1.45rem;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
  header p{margin:0;color:var(--mut);font-size:.92rem}

  /* ---- bodi gantungan = area crop ---- */
  .fob{
    position:relative; isolation:isolate; margin:16px auto 0; width:min(100%,360px);
    background:var(--bezel); border-radius:30px; padding:16px 16px 20px;
    box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 12px 28px -12px rgba(0,0,0,.45);
  }
  .fob.drag{outline:3px dashed var(--ac);outline-offset:6px}
  .screen{position:relative;border-radius:8px;overflow:hidden;background:#000;line-height:0}
  #cv{
    width:100%; aspect-ratio:1/1; display:block; touch-action:none; cursor:grab;
    -webkit-user-select:none; user-select:none; outline:none;
  }
  #cv.grabbing{cursor:grabbing}
  #cv:focus-visible{box-shadow:0 0 0 3px var(--ac) inset}
  .empty{
    position:absolute; inset:0; width:100%; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:8px; background:transparent; border:0; color:#e8eaf0;
    font:inherit; font-size:.95rem; line-height:1.35; cursor:pointer; padding:12px; text-align:center;
  }
  .empty svg{width:34px;height:34px;opacity:.85}
  .empty small{color:#9aa1ae;font-size:.8rem}
  .empty[hidden]{display:none}
  .empty:focus-visible{outline:3px solid var(--ac);outline-offset:-3px}
  .size-tag{
    margin:12px 0 0; text-align:center; font-size:.78rem; color:#8d94a1; line-height:1;
    font-variant-numeric:tabular-nums;
  }

  .hint{margin:16px 0 0;text-align:center;color:var(--mut);font-size:.85rem;min-height:1.3em}

  /* ---- panel ---- */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:16px}
  .panel h2{font-size:.95rem;margin:0 0 10px}
  .zoomrow{display:flex;align-items:center;gap:10px}
  .zoomrow input[type=range]{flex:1;min-width:0;accent-color:var(--ac);height:28px}
  .zoomrow output{min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--mut)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}

  button,.btn{
    font:inherit; font-size:.92rem; font-weight:600; border:0; border-radius:10px; padding:11px 12px;
    background:var(--soft); color:var(--ink); cursor:pointer; text-align:center; min-height:44px;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    transition:background .15s,opacity .15s;
  }
  button:hover:not(:disabled),.btn:hover{filter:brightness(.97)}
  button:disabled{opacity:.4;cursor:default}
  button.pri{background:var(--ac);color:var(--acink)}
  button.ico{padding:0;width:44px;flex:none}
  button:focus-visible,.btn:focus-visible,select:focus-visible,summary:focus-visible,input:focus-visible{
    outline:3px solid var(--ac);outline-offset:2px;
  }

  /* ---- koneksi ---- */
  .conn{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .chip{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;color:var(--mut);min-width:0}
  .chip i{width:9px;height:9px;border-radius:50%;background:var(--mut);flex:none}
  .chip.on{color:var(--ink)} .chip.on i{background:var(--ok)}
  .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  progress{width:100%;height:8px;margin:14px 0 0;appearance:none;-webkit-appearance:none;border:0;border-radius:99px;overflow:hidden;background:var(--soft)}
  progress::-webkit-progress-bar{background:var(--soft)}
  progress::-webkit-progress-value{background:var(--ac);transition:width .1s}
  progress::-moz-progress-bar{background:var(--ac)}
  #log{margin:10px 0 0;font-size:.88rem;min-height:1.3em;color:var(--mut);white-space:pre-wrap}
  #log.ok{color:var(--ok)} #log.bad{color:var(--bad)}

  details{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  summary{cursor:pointer;font-size:.88rem;color:var(--mut)}
  .set{display:grid;gap:12px;margin-top:12px;font-size:.88rem}
  .set label{display:flex;align-items:center;justify-content:space-between;gap:10px}
  select{font:inherit;font-size:.88rem;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:62%}
  .note{margin:16px 4px 0;color:var(--mut);font-size:.78rem}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>Gantungan Musik</h1>
    <p>Atur foto di layar gantungan, lalu kirim lewat Bluetooth.</p>
  </header>

  <section class="fob" id="fob" aria-label="Area crop 240 kali 240">
    <div class="screen">
      <canvas id="cv" tabindex="0" aria-label="Area crop. Geser untuk memindahkan foto, plus dan minus untuk zoom."></canvas>
      <button class="empty" id="empty" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 16-5-5-8 8"/></svg>
        <span>Pilih foto</span>
        <small>atau seret foto ke sini</small>
      </button>
    </div>
    <p class="size-tag">240 × 240 piksel</p>
  </section>
  <p class="hint" id="hint">Pilih foto untuk mulai mengatur bagian yang tampil.</p>

  <section class="panel" aria-label="Atur foto">
    <div class="zoomrow">
      <button class="ico" id="zout" type="button" aria-label="Perkecil" disabled>−</button>
      <input id="zoom" type="range" min="0" max="1000" value="0" aria-label="Zoom" disabled>
      <button class="ico" id="zin" type="button" aria-label="Perbesar" disabled>+</button>
      <output id="zval">1,0×</output>
    </div>
    <div class="grid3">
      <button id="fill" type="button" disabled>Isi layar</button>
      <button id="fit" type="button" disabled>Muat semua</button>
      <button id="rot" type="button" disabled>Putar 90°</button>
    </div>
    <div class="grid2">
      <label class="btn" for="file">Ganti foto</label>
      <button id="reset" type="button" disabled>Atur ulang</button>
    </div>
    <input id="file" type="file" accept="image/*" hidden>
  </section>

  <section class="panel" aria-label="Kirim ke gantungan">
    <div class="conn">
      <div class="chip" id="chip" role="status"><i></i><span id="chipTxt">Belum terhubung</span></div>
      <button id="conn" type="button">Hubungkan</button>
    </div>
    <div class="grid2">
      <button id="send" class="pri" type="button" disabled>Kirim foto</button>
      <button id="clear" type="button" disabled>Hapus gambar</button>
    </div>
    <progress id="bar" value="0" max="1"></progress>
    <div id="log" role="status">Belum ada foto.</div>

    <details>
      <summary>Pengaturan</summary>
      <div class="set">
        <label>Mode kirim
          <select id="mode">
            <option value="resp">Andal (disarankan)</option>
            <option value="nr">Cepat (tanpa konfirmasi)</option>
          </select>
        </label>
        <label>Garis bantu (sepertiga)
          <input id="grid" type="checkbox" checked>
        </label>
      </div>
    </details>
  </section>

  <p class="note">Butuh Chrome/Edge (desktop/Android) atau Bluefy (iOS). Safari iOS biasa tidak mendukung Web Bluetooth.</p>
</main>

<script>
const SVC  = '7a1c0001-5b6e-4f0a-9d5e-1f2c3d4e5a60';
const DATA = '7a1c0002-5b6e-4f0a-9d5e-1f2c3d4e5a60';
const STAT = '7a1c0003-5b6e-4f0a-9d5e-1f2c3d4e5a60';
const MAX_BYTES = 48 * 1024;   // samakan dengan IMG_MAX_BYTES di Config.h
const CHUNK = 100;             // payload per paket (aman untuk MTU kecil)
const OUT = 240;               // ukuran layar gantungan
const MAXZ = 6;                // zoom maksimum relatif terhadap "isi layar"
const ERR = {3:'ukuran tidak valid',4:'CRC salah',5:'urutan paket salah',6:'RAM ESP32 kurang',
             7:'LittleFS bermasalah',9:'timeout di ESP32',10:'JPEG tidak valid (harus baseline)'};

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
function log(t, k){ const l = $('log'); l.textContent = t; l.className = k || ''; }
const fmtZ = z => z.toFixed(1).replace('.', ',') + '×';
const sleep = ms => new Promise(r => setTimeout(r, ms));

let dev, dataC, statC, lastStatus = -1, waiter = null, busy = false;

// ================= EDITOR CROP =================
// Posisi disimpan dinormalisasi (0..1 terhadap sisi area crop) agar tetap benar saat layar diubah ukurannya.
let src = null;            // ImageBitmap atau canvas hasil rotasi
let zoom = 1, nx = .5, ny = .5;   // zoom relatif "isi layar"; (nx,ny) = pusat foto
let V = 320, dpr = 1;
let estTimer = 0, estSeq = 0;

const baseScale = S => Math.max(S / src.width, S / src.height);
const minZoom = () => Math.min(1 / src.width, 1 / src.height) / Math.max(1 / src.width, 1 / src.height);

function clampAxis(c, len){
  return len >= 1 ? Math.min(len / 2, Math.max(1 - len / 2, c))
                  : Math.min(1 - len / 2, Math.max(len / 2, c));
}
function clampAll(){
  zoom = Math.min(MAXZ, Math.max(minZoom(), zoom));
  const b = Math.max(1 / src.width, 1 / src.height) * zoom;
  nx = clampAxis(nx, src.width * b);
  ny = clampAxis(ny, src.height * b);
}

function render(c, S){
  const b = baseScale(S) * zoom, dw = src.width * b, dh = src.height * b;
  c.drawImage(src, nx * S - dw / 2, ny * S - dh / 2, dw, dh);
}

function draw(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  if (!src) return;
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  render(ctx, cv.width);
  if ($('grid').checked) {
    const S = cv.width;
    ctx.strokeStyle = 'rgba(255,255,255,.32)'; ctx.lineWidth = Math.max(1, dpr * .8);
    ctx.beginPath();
    for (let i = 1; i < 3; i++) { ctx.moveTo(S * i / 3, 0); ctx.lineTo(S * i / 3, S); ctx.moveTo(0, S * i / 3); ctx.lineTo(S, S * i / 3); }
    ctx.stroke();
  }
}

function syncUI(){
  const has = !!src;
  ['zoom','zin','zout','fill','fit','rot','reset'].forEach(i => $(i).disabled = !has);
  $('empty').hidden = has;
  if (has) {
    const mz = minZoom();
    $('zoom').value = mz >= MAXZ ? 0 : Math.round(Math.log(zoom / mz) / Math.log(MAXZ / mz) * 1000);
    $('zval').textContent = fmtZ(zoom);
  }
  $('send').disabled = busy || !(dataC && src);
  $('clear').disabled = busy || !dataC;
  $('conn').disabled = busy || !btOK;
}

function changed(){
  if (!src) return;
  clampAll(); draw(); syncUI(); scheduleEstimate();
}

function setZoomAt(z, px, py){
  const mz = minZoom(); z = Math.min(MAXZ, Math.max(mz, z));
  const r = z / zoom;
  nx = px + (nx - px) * r; ny = py + (ny - py) * r; zoom = z;
}

function layout(){
  V = cv.clientWidth || 320;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = cv.height = Math.round(V * dpr);
  if (src) { clampAll(); }
  draw();
}
new ResizeObserver(layout).observe(cv);

// ---- gestur: geser, cubit, gulir, keyboard
const ptr = new Map();
cv.addEventListener('pointerdown', e => {
  if (!src) return;
  cv.setPointerCapture(e.pointerId); cv.classList.add('grabbing');
  ptr.set(e.pointerId, {x: e.clientX, y: e.clientY});
});
cv.addEventListener('pointermove', e => {
  const prev = ptr.get(e.pointerId); if (!prev || !src) return;
  const cur = {x: e.clientX, y: e.clientY};
  if (ptr.size === 1) {
    nx += (cur.x - prev.x) / V; ny += (cur.y - prev.y) / V;
  } else if (ptr.size === 2) {
    const other = [...ptr.entries()].find(([id]) => id !== e.pointerId)[1];
    const d0 = Math.hypot(prev.x - other.x, prev.y - other.y) || 1;
    const d1 = Math.hypot(cur.x - other.x, cur.y - other.y);
    const rc = cv.getBoundingClientRect();
    const m0x = (prev.x + other.x) / 2, m0y = (prev.y + other.y) / 2;
    const m1x = (cur.x + other.x) / 2,  m1y = (cur.y + other.y) / 2;
    nx += (m1x - m0x) / V; ny += (m1y - m0y) / V;
    setZoomAt(zoom * d1 / d0, (m1x - rc.left) / V, (m1y - rc.top) / V);
  }
  ptr.set(e.pointerId, cur);
  changed();
});
const endPtr = e => { ptr.delete(e.pointerId); if (!ptr.size) cv.classList.remove('grabbing'); };
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', e => {
  if (!src) return; e.preventDefault();
  const rc = cv.getBoundingClientRect();
  setZoomAt(zoom * Math.exp(-e.deltaY * .0015), (e.clientX - rc.left) / V, (e.clientY - rc.top) / V);
  changed();
}, {passive: false});
cv.addEventListener('keydown', e => {
  if (!src) return;
  const st = .02; let h = true;
  if (e.key === 'ArrowLeft') nx -= st; else if (e.key === 'ArrowRight') nx += st;
  else if (e.key === 'ArrowUp') ny -= st; else if (e.key === 'ArrowDown') ny += st;
  else if (e.key === '+' || e.key === '=') setZoomAt(zoom * 1.1, .5, .5);
  else if (e.key === '-') setZoomAt(zoom / 1.1, .5, .5);
  else h = false;
  if (h) { e.preventDefault(); changed(); }
});

// ---- kontrol
$('zoom').oninput = e => {
  const mz = minZoom();
  setZoomAt(mz * Math.pow(MAXZ / mz, e.target.value / 1000), .5, .5);
  changed();
};
$('zin').onclick  = () => { setZoomAt(zoom * 1.15, .5, .5); changed(); };
$('zout').onclick = () => { setZoomAt(zoom / 1.15, .5, .5); changed(); };
$('fill').onclick = () => { zoom = 1; nx = ny = .5; changed(); $('hint').textContent = 'Foto memenuhi layar; bagian di luar kotak terpotong.'; };
$('fit').onclick  = () => { zoom = minZoom(); nx = ny = .5; changed(); $('hint').textContent = 'Seluruh foto terlihat; sisa area diisi hitam.'; };
$('reset').onclick = () => $('fill').onclick();
$('rot').onclick = () => {
  const c = document.createElement('canvas'); c.width = src.height; c.height = src.width;
  const x = c.getContext('2d');
  x.translate(c.width / 2, c.height / 2); x.rotate(Math.PI / 2);
  x.drawImage(src, -src.width / 2, -src.height / 2);
  if (src.close) src.close();
  src = c; zoom = 1; nx = ny = .5; changed();
};
$('grid').onchange = draw;
$('empty').onclick = () => $('file').click();

// ---- muat foto (dari input atau seret-lepas)
async function loadFile(f){
  if (!f) return;
  let bmp;
  try { bmp = await createImageBitmap(f); }
  catch { log('Format foto tidak bisa dibaca browser ini. Coba JPG atau PNG.', 'bad'); return; }
  if (src && src.close) src.close();
  src = bmp; zoom = 1; nx = ny = .5;
  $('hint').textContent = 'Geser foto untuk memilih bagian yang tampil. Cubit atau gulir untuk zoom.';
  layout(); changed();
}
$('file').onchange = e => { const f = e.target.files[0]; e.target.value = ''; loadFile(f); };
const fob = $('fob');
['dragenter','dragover'].forEach(t => fob.addEventListener(t, e => { e.preventDefault(); fob.classList.add('drag'); }));
['dragleave','drop'].forEach(t => fob.addEventListener(t, e => { e.preventDefault(); fob.classList.remove('drag'); }));
fob.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f && f.type.startsWith('image/')) loadFile(f); });

// ---- ekspor 240x240 -> JPEG <= MAX_BYTES
async function encode(){
  const o = document.createElement('canvas'); o.width = o.height = OUT;
  const c = o.getContext('2d');
  c.fillStyle = '#000'; c.fillRect(0, 0, OUT, OUT);
  c.imageSmoothingQuality = 'high';
  render(c, OUT);
  for (let q = 0.92; q >= 0.3; q -= 0.06) {
    const b = await new Promise(r => o.toBlob(r, 'image/jpeg', q));
    if (!b) continue;
    const u = new Uint8Array(await b.arrayBuffer());
    if (u.length <= MAX_BYTES) return {u, q};
  }
  return null;
}
function scheduleEstimate(){
  clearTimeout(estTimer);
  estTimer = setTimeout(async () => {
    const my = ++estSeq;
    const r = await encode();
    if (my !== estSeq || busy) return;
    if (r) log(`Siap dikirim · JPEG ${(r.u.length / 1024).toFixed(1)} KB (kualitas ${r.q.toFixed(2)})`);
    else log('Foto terlalu besar walau kualitas diturunkan.', 'bad');
  }, 350);
}

// ================= BLE =================
const btOK = window.isSecureContext && 'bluetooth' in navigator;
if (!btOK) {
  log(!window.isSecureContext
    ? 'Halaman harus dibuka lewat HTTPS.'
    : 'Browser ini tidak mendukung Web Bluetooth. Pakai Chrome/Edge (desktop/Android) atau Bluefy (iOS).', 'bad');
}

// CRC32 (sama dengan ESP32)
const T = new Uint32Array(256);
for (let i = 0; i < 256; i++) { let c = i; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; T[i] = c >>> 0; }
function crc32(b){ let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = T[(c ^ b[i]) & 255] ^ (c >>> 8); return (~c) >>> 0; }

function setChip(on, name){
  $('chip').className = 'chip' + (on ? ' on' : '');
  $('chipTxt').textContent = on ? 'Terhubung · ' + name : 'Belum terhubung';
  $('conn').textContent = on ? 'Putuskan' : 'Hubungkan';
}

function onNotify(e){ lastStatus = e.target.value.getUint8(0); if (waiter) waiter(); }

$('conn').onclick = async () => {
  if (!btOK) return;
  if (dev && dev.gatt.connected) { dev.gatt.disconnect(); return; }
  try {
    dev = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'Gantungan' }], optionalServices: [SVC] });
    dev.addEventListener('gattserverdisconnected', () => { dataC = null; statC = null; setChip(false); log('Koneksi terputus.'); syncUI(); });
    log('Menghubungkan…');
    const srv = await dev.gatt.connect();
    const svc = await srv.getPrimaryService(SVC);
    dataC = await svc.getCharacteristic(DATA);
    statC = await svc.getCharacteristic(STAT);
    statC.addEventListener('characteristicvaluechanged', onNotify);
    await statC.startNotifications();
    setChip(true, dev.name || 'Gantungan');
    log(src ? 'Terhubung. Siap mengirim.' : 'Terhubung. Pilih foto, lalu kirim.', 'ok');
    syncUI();
  } catch (e) {
    log(e.name === 'NotFoundError' ? 'Dibatalkan, atau perangkat "Gantungan…" tidak ditemukan.' : 'Gagal terhubung: ' + e.message, 'bad');
  }
};

function waitStatus(ok, ms){
  return new Promise((res, rej) => {
    const t = setTimeout(() => { waiter = null; rej(new Error('ESP32 tidak membalas')); }, ms);
    waiter = () => {
      if (ok.includes(lastStatus)) { clearTimeout(t); waiter = null; res(lastStatus); }
      else if (ERR[lastStatus])    { clearTimeout(t); waiter = null; rej(new Error(ERR[lastStatus])); }
    };
    waiter();
  });
}

// Mode "Andal": write dengan konfirmasi -> tiap paket dipastikan sampai sebelum paket berikutnya.
// Mode "Cepat": tanpa konfirmasi + jeda kecil (bisa kehilangan paket jika ESP32 lambat).
async function writePkt(pkt){
  const p = dataC.properties;
  const useResp = $('mode').value === 'resp' ? (p.write || !p.writeWithoutResponse) : !p.writeWithoutResponse;
  if (useResp) { await dataC.writeValueWithResponse(pkt); return; }
  for (let i = 0; i < 5; i++) {
    try { await dataC.writeValueWithoutResponse(pkt); await sleep(12); return; }
    catch (e) { await sleep(20); }
  }
  throw new Error('Gagal menulis paket');
}

$('send').onclick = async () => {
  if (!dataC || !src) return;
  busy = true; syncUI(); $('bar').value = 0;
  try {
    clearTimeout(estTimer); estSeq++;
    log('Menyiapkan foto…');
    const enc = await encode();
    if (!enc) throw new Error('foto terlalu besar walau kualitas diturunkan');
    const jpeg = enc.u;

    lastStatus = -1;
    const hdr = new Uint8Array(9); hdr[0] = 1;
    const dv = new DataView(hdr.buffer);
    dv.setUint32(1, jpeg.length, true); dv.setUint32(5, crc32(jpeg), true);
    let p = waitStatus([1], 4000);
    await dataC.writeValueWithResponse(hdr);
    await p;

    const t0 = performance.now();
    for (let off = 0, seq = 0; off < jpeg.length; off += CHUNK, seq++) {
      if (!dataC) throw new Error('koneksi terputus');
      if (ERR[lastStatus]) throw new Error(ERR[lastStatus] + ` (sekitar paket ${seq})`);
      const part = jpeg.subarray(off, off + CHUNK);
      const pkt = new Uint8Array(3 + part.length);
      pkt[0] = 2; pkt[1] = seq & 255; pkt[2] = seq >> 8; pkt.set(part, 3);
      await writePkt(pkt);
      if (seq % 8 === 0) { $('bar').value = off / jpeg.length; log(`Mengirim… ${Math.round(off / jpeg.length * 100)}%`); }
    }
    $('bar').value = 1;
    p = waitStatus([2], 10000);
    await dataC.writeValueWithResponse(new Uint8Array([3]));
    await p;
    log(`Terkirim ✔ ${(jpeg.length / 1024).toFixed(1)} KB dalam ${((performance.now() - t0) / 1000).toFixed(1)} detik`, 'ok');
  } catch (e) { log('Gagal: ' + e.message, 'bad'); }
  busy = false; syncUI();
};

$('clear').onclick = async () => {
  busy = true; syncUI();
  try {
    lastStatus = -1;
    const p = waitStatus([8], 4000);
    await dataC.writeValueWithResponse(new Uint8Array([5]));
    await p;
    $('bar').value = 0;
    log('Gambar di gantungan dihapus.', 'ok');
  } catch (e) { log('Gagal: ' + e.message, 'bad'); }
  busy = false; syncUI();
};

layout(); syncUI();
</script>
</body>
</html>
